# ==========================================================
#  nginx reverse proxy — OSHEQ Certificate Backend
#  /etc/nginx/sites-available/osheq-certificates
#  sudo ln -s /etc/nginx/sites-available/osheq-certificates /etc/nginx/sites-enabled/
#  sudo nginx -t && sudo systemctl reload nginx
# ==========================================================

upstream osheq_cert {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name certificates.your-domain.com;

    # Certbot isi block ko https par redirect kar dega
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name certificates.your-domain.com;

    # ---- SSL (certbot --nginx in lines ko bhar dega) ----
    ssl_certificate     /etc/letsencrypt/live/certificates.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/certificates.your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # QR scan par certificate preview bada hota hai + PDF render me time lagta hai
    client_max_body_size 10m;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    access_log /var/log/nginx/osheq-cert.access.log;
    error_log  /var/log/nginx/osheq-cert.error.log;

    gzip on;
    gzip_types application/json text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ---- QR verify page + PDF download: PDF render ke liye 120s ----
    location ~ ^/(api/certificates|api/pdf|v/) {
        proxy_pass http://osheq_cert;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 15s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }

    # ---- Baaki API ----
    location / {
        proxy_pass http://osheq_cert;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 15s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
